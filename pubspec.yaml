name: self_dojo_mobile
description: "Self Dojo - App de desenvolvimento pessoal"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & DI
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Firebase (only Auth)
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.4

  # Supabase (Database & Storage)
  supabase_flutter: ^2.8.4

  # Utils
  equatable: ^2.0.7
  image_picker: ^1.2.1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
